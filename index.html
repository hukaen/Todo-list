<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="w-[720px] mx-auto font-Manrope">
    <!-- head  -->
    <div id="head" class="flex flex-col gap-4 items-center mt-10">
      <h1 class="font-bold text-[26px]">ХИЙХ ЗҮЙЛС</h1>
      <span id="" class="font-medium text-[16px]">0/5 дууссан</span>
      <div id="inputContai" class="w-full flex gap-4">
        <input
          id="todoInput"
          type="text"
          placeholder="Юу хийх вэ?"
          class="text-[#C3C1E5] h-[38px] border border-[#6C63FF] rounded-[5px] px-4 w-full"
        />
        <button
          class="h-[38px] bg-[#6C63FF] text-white rounded-[5px] px-4"
          onclick="addTodo()"
        >
          Нэмэх
        </button>
      </div>
    </div>
    <!-- body  -->
    <div
      id="list"
      class="mx-auto w-[520px] flex flex-col gap-[17px] mt-10"
    ></div>
    <script src="script.js"></script>
  </body>
</html>
